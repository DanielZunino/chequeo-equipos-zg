<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chequeo de equipos ZG SpA</title>
<style>
:root{--dark:#1E3A2F;--dark2:#2E5E45;--amber:#F2A900;--ok:#2E7D32;--okbg:#E3F4E4;--warn:#E65100;--warnbg:#FFF0E0;--bad:#C62828;--badbg:#FDE3E3;--doc:#6A1B9A;--bg:#F1F5F2;--card:#fff;--txt:#1F2D3A;--mut:#64748B;--line:#E2E8F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
header .t{font-weight:800;font-size:17px;letter-spacing:.2px}.hrow{display:flex;align-items:center;gap:12px}.logo{height:44px;background:#fff;border-radius:10px;padding:3px 6px}
.vozb{border:0;background:#ffffff22;color:#fff;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:0 0 44px}.vozb.off{opacity:.5}
.oir{border:0;background:#E8F2EC;color:var(--dark2);font-weight:800;font-size:13px;border-radius:9px;padding:5px 9px;cursor:pointer;margin-left:6px}
.hablando{outline:3px solid var(--amber);outline-offset:2px}header .s{color:var(--amber);font-size:12.5px;font-weight:600;margin-top:2px}
.prog{height:6px;background:#ffffff30;border-radius:9px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001,0 4px 14px #1e3a2f0d}
h2{margin:4px 0 6px;font-size:20px;color:var(--dark)}h3{margin:0 0 8px;font-size:16px;color:var(--dark)}
p.m{color:var(--mut);margin:0 0 12px;font-size:14.5px;line-height:1.4}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dark2)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--dark);color:#fff;cursor:pointer;text-align:center}
.btn.am{background:var(--amber);color:#1b1b1b}.btn.gh{background:#fff;color:var(--dark);border:2px solid var(--line)}.btn:disabled{opacity:.45}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.foot .btn{padding:14px}.foot .gh{flex:0 0 34%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;margin:3px 4px 3px 0}
.b-ok{background:var(--okbg);color:var(--ok)}.b-w{background:var(--warnbg);color:var(--warn)}.b-x{background:var(--badbg);color:var(--bad)}.b-n{background:#EEF2F7;color:var(--mut)}
.eqs{display:grid;gap:10px}
.eq{display:flex;align-items:center;gap:12px;border:2.5px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.eq svg{flex:0 0 84px;height:54px}.eq b{font-size:16.5px;display:block}.eq span{font-size:13px;color:var(--mut)}
.eq.sel{border-color:var(--amber);background:#FFF8E5}.eq .sug{font-size:11.5px;font-weight:800;color:var(--ok);display:block;margin-top:3px}
.pers{display:grid;gap:8px}.per{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.per .av{width:42px;height:42px;border-radius:50%;background:var(--dark2);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 42px}.per b{display:block;font-size:15.5px}.per span{font-size:12.5px;color:var(--mut)}
.per.yo{border-color:var(--amber);background:#FFF8E5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:#E8F2EC;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
.info.w{background:var(--warnbg)}.info.x{background:var(--badbg)}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.bh .ic{font-size:34px;width:52px;height:52px;border-radius:14px;background:#FFF3D1;display:grid;place-items:center}
.item{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff;transition:border-color .2s}
.item.v-B{border-color:#A5D6A7}.item.v-R{border-color:#FFCC80}.item.v-M{border-color:#EF9A9A}.item.v-NA{border-color:#CFD8DC}
.it-h{display:flex;gap:10px;align-items:flex-start}.it-h .e{font-size:24px;line-height:1}.it-h b{font-size:15.5px}
.crit{font-size:11px;font-weight:800;color:var(--bad);background:var(--badbg);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tip{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.why{border:0;background:none;color:var(--dark2);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer}
.whyt{display:none;font-size:13.5px;background:#FFF8E5;border-radius:10px;padding:8px 10px;margin-top:4px;line-height:1.4}.whyt.on{display:block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 2px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--mut)}
.opts button .x{display:block;font-size:20px;margin-bottom:2px}
.opts .on.B{background:var(--ok);border-color:var(--ok);color:#fff}.opts .on.R{background:var(--warn);border-color:var(--warn);color:#fff}
.opts .on.M{background:var(--bad);border-color:var(--bad);color:#fff}.opts .on.NA{background:#78909C;border-color:#78909C;color:#fff}
.det{margin-top:10px;display:none}.det.on{display:block}.det textarea{min-height:58px;font-size:15px}
.ph{display:flex;align-items:center;gap:10px;margin-top:8px}.ph label{font-size:14px;font-weight:700;color:var(--dark2);cursor:pointer;border:2px dashed #B0BEC5;border-radius:10px;padding:8px 12px}
.ph img{height:54px;border-radius:8px}
.sem{border-radius:18px;padding:18px;text-align:center;color:#fff;margin-bottom:14px}
.sem .r{font-size:30px;font-weight:900;letter-spacing:.5px}.sem .m{font-size:15px;margin-top:4px;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 3px #0001}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut);font-weight:700}
.al{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.al:last-child{border:0}
.al i{font-style:normal;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap}
.lv-Crítica{background:var(--badbg);color:var(--bad)}.lv-Documento{background:#F3E5F5;color:var(--doc)}.lv-Media{background:var(--warnbg);color:var(--warn)}.lv-Leve{background:#EEF2F7;color:var(--mut)}
.who{display:flex;align-items:center;gap:12px;padding:11px;border:2px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;background:#fff}
.who.on{border-color:var(--dark2);background:#E8F2EC}.who .ck{width:26px;height:26px;border-radius:8px;border:2px solid #B0BEC5;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 26px}
.who.on .ck{background:var(--dark2);border-color:var(--dark2)}.who b{font-size:15px}.who span{display:block;font-size:12.5px;color:var(--mut)}.who.lock{cursor:default}
canvas{width:100%;height:150px;border:2px dashed #B0BEC5;border-radius:12px;background:#fff;touch-action:none}
.center{text-align:center}.big{font-size:56px}.mut{color:var(--mut)}.small{font-size:13px}
.hide{display:none!important}.spin{width:42px;height:42px;border:5px solid #E2E8F0;border-top-color:var(--amber);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}
.nuevo{border:2.5px dashed var(--amber);border-radius:14px;padding:12px;margin-top:12px;background:#FFFBF0}
.pie{text-align:center;color:#94A3B8;font-size:11.5px;margin-top:20px}
#mano{position:fixed;z-index:20;font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 4px #0005);transition:left .35s ease,top .35s ease,opacity .25s;opacity:0}
#mano.on{opacity:1;animation:toque 1.1s ease-in-out infinite}
@keyframes toque{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pulso{animation:pulso 1.4s ease-in-out infinite;border-radius:14px}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 #F2A90000}50%{box-shadow:0 0 0 6px #F2A90066}}
.fecha-row{display:flex;gap:8px;align-items:center}.fecha-row input{font-size:20px;letter-spacing:1px;text-align:center;max-width:190px}
#rut{font-size:22px;letter-spacing:1px;text-align:center}
</style>
</head>
<body>
<header><div class="hrow"><img class="logo" id="logo" alt="ZG SpA" src="" style="display:none"><div style="flex:1;min-width:0"><div class="t">Chequeo de equipos</div><div class="s" id="sub">ZG SpA</div></div><button id="bVoz" class="vozb" onclick="togVoz()" aria-label="Voz">🔊</button></div><div class="prog"><i id="bar"></i></div></header>
<main id="app"><div class="card center"><div class="spin"></div><p class="mut">Cargando…</p></div></main>
<div id="mano">👆</div>
<div class="foot hide" id="foot"><div class="in"><button class="btn gh" id="bBack">← Atrás</button><button class="btn am" id="bNext">Siguiente →</button></div></div>

<script>
// ===================== CONFIGURACIÓN =====================
const DIAS_AVISO = 30;               // documentos/licencia: avisar cuando falten menos de 30 días
const DIAS_SIN_CHEQUEO = 7;          // alerta si el equipo lleva más de 7 días sin chequeo
const AVISO_KM = 1000, AVISO_H = 25; // aviso de cambio de aceite próximo
const INTERVALO = { km: 10000, h: 250 };
// ==========================================================

const SVG = {
  camioneta: '<svg viewBox="0 0 120 70"><path d="M8 40h22l10-14h26l6 14h40v12H8z" fill="#2E5E45"/><path d="M43 29h20l5 11H37z" fill="#BFE3FF"/><rect x="72" y="34" width="38" height="6" fill="#F2A900"/><circle cx="30" cy="54" r="9" fill="#263238"/><circle cx="30" cy="54" r="4" fill="#B0BEC5"/><circle cx="92" cy="54" r="9" fill="#263238"/><circle cx="92" cy="54" r="4" fill="#B0BEC5"/></svg>',
  furgon: '<svg viewBox="0 0 120 70"><path d="M6 14h76l20 14 12 6v18H6z" fill="#ECEFF1" stroke="#2E5E45" stroke-width="3"/><path d="M84 18l16 12H84z" fill="#BFE3FF"/><rect x="14" y="24" width="56" height="14" rx="3" fill="#F2A900"/><path d="M22 31h40" stroke="#1E3A2F" stroke-width="3"/><circle cx="28" cy="54" r="9" fill="#263238"/><circle cx="94" cy="54" r="9" fill="#263238"/></svg>',
  piso: '<svg viewBox="0 0 120 70"><rect x="2" y="12" width="78" height="32" rx="2" fill="#8D6E63"/><path d="M8 38l8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8" stroke="#F2A900" stroke-width="3" fill="none"/><path d="M84 20h18l14 14v12H84z" fill="#2E5E45"/><rect x="90" y="24" width="12" height="9" rx="2" fill="#BFE3FF"/><circle cx="16" cy="54" r="8" fill="#263238"/><circle cx="34" cy="54" r="8" fill="#263238"/><circle cx="92" cy="54" r="8" fill="#263238"/><circle cx="108" cy="54" r="8" fill="#263238"/></svg>',
  cama: '<svg viewBox="0 0 120 70"><path d="M4 44h56l6-8h18v10H4z" fill="#455A64"/><path d="M14 30h20v-8l10-6 10 10v8H14z" fill="#F2A900"/><path d="M84 20h18l14 14v12H84z" fill="#2E5E45"/><rect x="90" y="24" width="12" height="9" rx="2" fill="#BFE3FF"/><circle cx="12" cy="54" r="7" fill="#263238"/><circle cx="28" cy="54" r="7" fill="#263238"/><circle cx="92" cy="54" r="8" fill="#263238"/><circle cx="108" cy="54" r="8" fill="#263238"/></svg>',
  excavadora: '<svg viewBox="0 0 120 70"><rect x="10" y="50" width="62" height="12" rx="6" fill="#263238"/><rect x="18" y="30" width="44" height="18" rx="3" fill="#F2A900"/><rect x="44" y="18" width="16" height="16" rx="2" fill="#2E5E45"/><rect x="47" y="21" width="10" height="8" fill="#BFE3FF"/><path d="M60 30l26-20 22 18" stroke="#F2A900" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M100 26l12 12-12 8z" fill="#455A64"/></svg>',
  bandit_or: '<svg viewBox="0 0 120 70"><rect x="10" y="50" width="70" height="12" rx="6" fill="#263238"/><rect x="14" y="28" width="52" height="20" rx="3" fill="#F2A900"/><path d="M66 32h22l14 10v6H66z" fill="#C62828"/><path d="M40 28l10-22h10l-6 22" fill="#455A64"/><path d="M54 8l18-6" stroke="#8D6E63" stroke-width="4" stroke-dasharray="3 3"/></svg>',
  bandit_ru: '<svg viewBox="0 0 120 70"><rect x="14" y="26" width="52" height="20" rx="3" fill="#F2A900"/><path d="M66 30h22l14 10v6H66z" fill="#C62828"/><path d="M40 26l10-20h10l-6 20" fill="#455A64"/><path d="M14 40H2" stroke="#455A64" stroke-width="4"/><circle cx="34" cy="54" r="9" fill="#263238"/><circle cx="34" cy="54" r="4" fill="#B0BEC5"/><circle cx="54" cy="54" r="9" fill="#263238"/><circle cx="54" cy="54" r="4" fill="#B0BEC5"/></svg>',
  arjes: '<svg viewBox="0 0 120 70"><rect x="6" y="52" width="64" height="11" rx="5" fill="#263238"/><path d="M8 14h50l-8 18H16z" fill="#2E5E45"/><rect x="12" y="32" width="44" height="18" rx="3" fill="#F2A900"/><circle cx="26" cy="41" r="5" fill="#455A64"/><circle cx="42" cy="41" r="5" fill="#455A64"/><path d="M56 44l58-18" stroke="#455A64" stroke-width="7" stroke-linecap="round"/></svg>'
};
const TIPOS = {
  camioneta:  { t: 'Camioneta',                d: 'Camioneta de faena (4x4 o 4x2)',                         lic: ['B'],  med: 'km', docs: true },
  furgon:     { t: 'Furgón de mantenimiento',  d: 'Furgón con herramientas, soldadura y repuestos',          lic: ['B'],  med: 'km', docs: true },
  piso:       { t: 'Camión piso caminante',    d: 'Tracto con batea de piso caminante (astilla / biomasa)',  lic: ['A5'], med: 'km', docs: true, rampla: true },
  cama:       { t: 'Camión cama baja',         d: 'Tracto con cama baja para trasladar maquinaria',          lic: ['A5'], med: 'km', docs: true, rampla: true },
  excavadora: { t: 'Excavadora',               d: 'Excavadora sobre orugas',                                 lic: ['D'],  med: 'h' },
  bandit_or:  { t: 'Triturador Bandit orugas', d: 'Moledora Bandit Beast 2660T (orugas)',              lic: ['D'],  med: 'h' },
  bandit_ru:  { t: 'Triturador Bandit ruedas', d: 'Moledora Bandit Beast 2660 (arrastre, con ruedas)',             lic: ['D'],  med: 'h' },
  arjes:      { t: 'Triturador Arjes',         d: 'Triturador de ejes lentos Arjes',                         lic: ['D'],  med: 'h' }
};
const VEH = t => TIPOS[t] && TIPOS[t].med === 'km';
const TRIT = t => /bandit|arjes/.test(t);
// [id, emoji, nombre, ¿qué mirar?, ¿por qué importa?, crítico]
const I = (id, e, t, tip, why, crit) => ({ id, e, t, tip, why, crit: !!crit });

// ---------- VEHÍCULOS (camioneta, furgón, camiones) ----------
function bVehExt(t) { const cam = t === 'piso' || t === 'cama'; return { id: 'ext', ic: '🚶', t: 'Vuelta al vehículo', d: 'Camina alrededor antes de subirte. Dos minutos que evitan una pana o un accidente.', items: [
  I('neum', '🛞', 'Neumáticos y tuercas' + (cam ? ' (tracto y rampla)' : '') + ', incluye repuesto', 'Sin cortes ni globos, con dibujo, bien inflados y sin tuercas sueltas.', 'Un neumático reventado o una rueda suelta hace perder el control del vehículo.', 1),
  I('luces', '💡', 'Luces: altas, bajas, freno, intermitentes y retroceso', 'Enciéndelas y míralas (o pide ayuda a un compañero).', 'Si no te ven frenar o doblar, te chocan. En camino de tierra con polvo, las luces son tu aviso.', 1),
  I('fugas', '💧', 'Sin fugas bajo el vehículo', 'Mira el piso: aceite, petróleo, refrigerante o líquido de frenos.', 'Una fuga de frenos o dirección te deja sin control; una de petróleo cerca del escape puede encenderse.', 1),
  I('espejos', '🪞', 'Espejos', 'Completos, firmes, sin trizaduras y bien regulados.', 'En faena hay personas y maquinaria moviéndose: el punto ciego puede esconder a alguien.'),
  I('parabrisas', '🪟', 'Parabrisas y limpiaparabrisas', 'Sin trizaduras frente a tus ojos; plumillas y agua funcionan.', 'Con lluvia, barro o polvo, ver bien es frenar a tiempo.'),
  I('carroceria', '🚚', 'Carrocería, peldaños y manillas', 'Sin piezas sueltas o cortantes; peldaños firmes.', 'Sube y baja siempre con 3 puntos de apoyo: los peldaños deben aguantar.'),
  ...(cam ? [I('huinchas', '🟥', 'Huinchas reflectantes del tracto y la rampla', 'Completas, pegadas y limpias.', 'De noche o con niebla son lo único que muestra el largo del camión.')] : [])]}; }
function bVehCab(t) { return { id: 'cab', ic: '🧑‍✈️', t: 'Cabina y mandos', d: 'Ya arriba, con el motor encendido. Prueba todo antes de moverte.', items: [
  I('frenos', '🛑', 'Frenos y freno de estacionamiento', 'Prueba a baja velocidad. ' + (t === 'piso' || t === 'cama' ? 'Sin fuga de aire ni pérdida de presión.' : 'Pedal firme, no se va al fondo.'), 'Es el sistema que más vidas salva. En caminos forestales con pendiente, si falla no se sale.', 1),
  I('direccion', '🎯', 'Dirección', 'Sin juego, ruidos ni tirones al girar.', 'Una dirección con juego se descontrola en una curva de ripio.', 1),
  I('cinturon', '🔒', 'Cinturón de seguridad', 'Engancha, se recoge y no está cortado.', 'En un volcamiento, el cinturón es la diferencia entre vivir o no.', 1),
  I('alarma', '📢', 'Bocina y alarma de retroceso', 'Ambas suenan fuerte.', 'En faena hay compañeros a pie detrás del vehículo.', 1),
  I('tablero', '📟', 'Tablero sin luces de falla', 'Ninguna luz roja queda encendida al partir.', 'El vehículo te avisa antes de una falla mayor: escúchalo.'),
  I('asiento', '💺', 'Asiento', 'Firme y regulado a tu medida.', 'Un asiento suelto te aleja de los pedales en una frenada.')]}; }
const B_VEH_NIV = { id: 'niv', ic: '🛢️', t: 'Niveles', d: 'Con motor frío y en terreno plano.', items: [
  I('aceite', '🛢️', 'Aceite de motor', 'Entre mínimo y máximo de la varilla.', 'Sin aceite, el motor se funde en minutos.'),
  I('refrig', '🌡️', 'Refrigerante del radiador', 'Sobre el mínimo. Nunca abras la tapa en caliente.', 'El vapor del radiador quema gravemente la cara y las manos.'),
  I('combustible', '⛽', 'Combustible sobre 1/4 (y AdBlue si tiene)', 'Revisa los indicadores del tablero.', 'Quedarse sin petróleo en un camino forestal te deja detenido en un lugar peligroso.'),
  I('bateria', '🔋', 'Batería y corta corriente', 'Bornes firmes y sin sulfato; corta corriente operativo.', 'El corta corriente evita incendios eléctricos en caso de choque.')]};
function bVehSeg(t) { return { id: 'seg', ic: '🧯', t: 'Elementos de seguridad', d: 'Lo que necesitas si algo sale mal en ruta o en faena.', items: [
  I('extintor', '🧯', 'Extintor', 'Manómetro en verde, sello y pasador puestos, fecha vigente y bien sujeto.', 'Un amago en el motor o en un pastizal se apaga en segundos… si el extintor sirve.', 1),
  I('botiquin', '🩹', 'Botiquín', 'Completo y a mano.', 'En faena la ayuda puede tardar: los primeros minutos son clave.'),
  I('triangulos', '⚠️', 'Triángulos o conos', 'Mínimo 2, en buen estado.', 'Si quedas detenido en ruta, avisan a los otros conductores.'),
  I('chaleco', '🦺', 'Chaleco reflectante', 'Disponible en la cabina.', 'Bajarse en ruta sin chaleco es ser invisible.'),
  I('gata', '🔧', 'Gata, llave de ruedas y cuñas', 'Disponibles y funcionando.', 'Sin ellas, un cambio de rueda se vuelve una maniobra improvisada y peligrosa.')]}; }

    const unlock = () => { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch (e) {} document.removeEventListener('pointerdown', unlock, true); };

      if (!v) { ir(k); return 'Falta revisar: ' + it.t; }
      if ((v === 'R' || v === 'M') && !(S.com[k] || '').trim()) { ir(k); return 'Cuenta brevemente qué encontraste en: ' + it.t; } } }
  if (p === pasoReporte() && !S.firma) return 'Falta tu firma.';
  return '';
}
function ir(k) { const el = document.getElementById('it-' + k.replace('.', '-')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
$('#bBack').onclick = () => { S.paso = Math.max(0, S.paso - 1); render(); };
$('#bNext').onclick = () => { const e = validar(); if (e) { alertaUI(e); VOZ.say(e); guia(true); return; } if (S.paso === pasoReporte()) return enviar(); S.paso++; render(); };
async function enviar() {
  S.enviando = true; render();
  const E = evaluar(), bl = bloques(), T = TIPOS[S.tipo], IN = indicadores();
  const fotos = Object.keys(S.fotos).map(k => { const [b, i] = k.split('.'), bb = bl.find(x => x.id === b), it = bb && bb.items.find(x => x.id === i); return { item: it ? it.t : k, b64: S.fotos[k] }; });
  const body = { pid: S.persona.id, tipo: S.tipo, patente: S.patente, nuevo: S.nuevoEq, marca: S.marca, anio: S.anio, rampla: patKey(S.rampla), fotoEquipo: S.nuevoEq ? S.fotoEq : '',
    faena: S.faena, km: S.km, prox: S.prox, med: T.med, docs: !!T.docs, soap: T.docs ? S.soap : '', permiso: T.docs ? S.permiso : '', rt: T.docs ? S.rt : '',
    aceiteTxt: IN.faltanTxt ? IN.faltanTxt + (IN.fechaEst ? ' (aprox. ' + IN.fechaEst + ')' : '') : '',
    resultado: E.resultado, mensaje: E.mensaje, pct: E.pct, aseo: E.aseo, alertas: E.al, okItems: E.okItems, obs: S.obs, reportar: S.rep, firma: S.firma, fotos,
    bloques: bl.map(b => ({ t: b.t, items: b.items.map(it => ({ t: it.t, crit: it.crit, v: S.res[b.id + '.' + it.id] || '', c: S.com[b.id + '.' + it.id] || '' })) })) };
  S.paso = pasoFin(); S.fin = null; render();
  try {
    const d = await api('apiGuardar', body);
    if (!d.ok) throw d.error || 'error';
    S.fin = Object.assign(d, { resultado: E.resultado }); S.enviando = false; try { localStorage.removeItem(LS); } catch (e) {}
    $('#app').innerHTML = vFin(); $('#foot').classList.add('hide'); $('#bar').style.width = '100%';
    VOZ.say(E.resultado === 'NO APTO' ? 'Chequeo enviado. Recuerda: no operes este equipo y avisa de inmediato a tu jefatura.' : '¡Chequeo enviado! Gracias por revisar tu equipo. Trabaja seguro.');
  } catch (e) { S.enviando = false; S.paso = pasoReporte(); render(); alertaUI('No se pudo enviar (' + e + '). Revisa tu señal e intenta de nuevo: tu chequeo está guardado.'); }
}
// Arranque: nómina y logo desde el servidor (o aprobación de un equipo nuevo desde el correo)
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('aprobar')) {
    try { const d = await fetch(SCRIPT_URL + '?' + new URLSearchParams({ api: 'aprobar', tok: q.get('aprobar'), ok: q.get('ok') })).then(r => r.json());
      $('#app').innerHTML = `<div class="card center"><div class="big">${!d.ok ? '⚠️' : d.aprobado ? '✅' : '❌'}</div><h2>Verificación de equipo</h2><p class="m" style="font-size:16px">${esc(d.msg || d.error || '')}</p><a class="btn gh" href="${location.pathname}" target="_self" style="text-decoration:none">Ir al chequeo</a></div>`;
    } catch (e) { $('#app').innerHTML = '<div class="card info x">No se pudo conectar con el servidor. Intenta de nuevo.</div>'; }
    return;
  }
  try { const L = localStorage.getItem('zg_logo'); if (L) { $('#logo').src = L; $('#logo').style.display = ''; } } catch (e) {}
  try { const d = await api('apiInicio'); S.personas = d.personas || []; S.form = d.form || '';
    if (d.logo) { $('#logo').src = d.logo; $('#logo').style.display = ''; try { localStorage.setItem('zg_logo', d.logo); } catch (e) {} }
    render();
  } catch (e) { $('#app').innerHTML = '<div class="card info x">No se pudo conectar con el servidor. Revisa tu señal y vuelve a abrir el enlace.</div>'; }
})();
</script>
